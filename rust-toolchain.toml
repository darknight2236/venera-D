# rhttp's locked crates require rustc >=1.88, and cargokit reads `channel` with a
# line-anchored regex, so keep it bare on its own line.
[toolchain]
channel = "stable"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
